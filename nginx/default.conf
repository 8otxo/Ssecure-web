server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index login.html;

    # Sin headers de seguridad — A02 (clase 08)

    location / {
        try_files $uri $uri/ /login.html;
    }

    location /api/ {
        # SIN barra final: nginx reenvía la ruta COMPLETA (/api/documentos).
        # Con barra final la recortaría y el backend recibiría /documentos.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTP plano hacia backend
    }

    location = /login {
        proxy_pass http://backend:8000/login;
        proxy_set_header Host $host;
    }
}
