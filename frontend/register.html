<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alta de usuario">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Vuestra defensa de la clase 02. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

  <title>Registro &middot; Artxibo</title>

  <link rel="stylesheet" href="/css/base.css">
  <script src="/js/register.js" defer></script>
</head>
<body>

  <!-- novalidate: los mensajes los ponemos nosotros, no el navegador.
       Los required se quedan: son la red de seguridad sin JavaScript. -->
  <main class="acceso">
    <h1>Crear cuenta</h1>
    <p class="subtitulo">Alta de usuario en Artxibo</p>

    <form action="/api/register" method="post" novalidate>
      <div>
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" required
               autocomplete="name" minlength="3" maxlength="80">
      </div>

      <div>
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required
               autocomplete="email" maxlength="120">
      </div>

      <div>
        <label for="nacimiento">Fecha de nacimiento</label>
        <input id="nacimiento" name="nacimiento" type="date" required
               min="1920-01-01" max="2008-12-31">
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
               autocomplete="new-password" minlength="8">
      </div>

      <div>
        <label for="password2">Repite la contraseña</label>
        <input id="password2" name="password2" type="password" required
               autocomplete="new-password" minlength="8">
      </div>

      <button type="submit">Crear cuenta</button>
    </form>

    <p class="hint">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </main>

</body>
</html>
